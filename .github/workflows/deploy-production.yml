name: Deploy production

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-project-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the production checkout
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
        run: |
          test -n "$DEPLOY_USER"
          DEPLOY_HOST=46.225.138.103
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            install -d -m 700 ~/.ssh
            printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
            SSH=(ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST")
          else
            test -n "$DEPLOY_PASSWORD"
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
            export SSHPASS="$DEPLOY_PASSWORD"
            SSH=(sshpass -e ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST")
          fi
          REPOSITORY_URL="https://github.com/${{ github.repository }}.git"
          GIT_AUTHORIZATION="Authorization: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          PRODUCTION_ENVIRONMENT="$(printf 'DOMAIN=www.leonstrotz.com\n' | base64 -w0)"
          CADDY_ROUTE="$(printf '%s\n' '' 'leonstrotz.com {' '  redir https://www.leonstrotz.com{uri} permanent' '}' '' 'www.leonstrotz.com {' '  encode zstd gzip' '' '  header {' '    -Server' '    X-Content-Type-Options "nosniff"' '    X-Frame-Options "DENY"' '    Referrer-Policy "strict-origin-when-cross-origin"' '    Permissions-Policy "camera=(), geolocation=(), microphone=()"' '    Strict-Transport-Security "max-age=31536000; includeSubDomains"' '  }' '' '  reverse_proxy live-project-dashboard:3000' '}' | base64 -w0)"
          "${SSH[@]}" "if [ ! -d /srv/live-project-dashboard/.git ]; then install -d /srv/live-project-dashboard; git -C /srv/live-project-dashboard init --initial-branch=master; git -C /srv/live-project-dashboard remote add origin '$REPOSITORY_URL'; git -C /srv/live-project-dashboard -c 'http.https://github.com/.extraheader=$GIT_AUTHORIZATION' fetch origin master; git -C /srv/live-project-dashboard checkout -B master origin/master; fi"
          "${SSH[@]}" "if [ ! -f /srv/live-project-dashboard/.env.production ]; then umask 077; printf %s '$PRODUCTION_ENVIRONMENT' | base64 -d > /srv/live-project-dashboard/.env.production; fi"
          if [ -n "$GITHUB_READ_TOKEN" ]; then
            GITHUB_READ_TOKEN_B64="$(printf %s "$GITHUB_READ_TOKEN" | base64 -w0)"
            printf %s "$GITHUB_READ_TOKEN_B64" | "${SSH[@]}" "token=\$(base64 -d); next=\$(mktemp); while IFS= read -r line || [ -n \"\$line\" ]; do case \"\$line\" in GITHUB_READ_TOKEN=*) printf 'GITHUB_READ_TOKEN=%s\\n' \"\$token\";; *) printf '%s\\n' \"\$line\";; esac; done < /srv/live-project-dashboard/.env.production > \"\$next\"; chmod 600 \"\$next\"; mv \"\$next\" /srv/live-project-dashboard/.env.production"
          fi
          cat scripts/gg-deploy.sh | "${SSH[@]}" "install -m 755 /dev/stdin /usr/local/bin/gg-deploy"
          "${SSH[@]}" "GIT_AUTHORIZATION='$GIT_AUTHORIZATION' gg-deploy /srv/live-project-dashboard master"
          printf %s "$CADDY_ROUTE" | "${SSH[@]}" "if grep -qxF 'www.leonstrotz.com {' /srv/cultural-enrichment-radar/Caddyfile; then cat >/dev/null; else cat | base64 -d >> /srv/cultural-enrichment-radar/Caddyfile && docker exec cultural-enrichment-radar-caddy-1 caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; fi"
